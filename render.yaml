services:
  - type: web
    name: clinica-tanah
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: false
    buildCommand: cd backend && npm install && cd ../frontend && npm install && npm run build && cd ../backend && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: META_WA_VERIFY_TOKEN
        value: clinica-tanah-verify
      - key: DEFAULT_LOCALE
        value: pt-BR
